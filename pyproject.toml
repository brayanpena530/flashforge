[project]
name = "flashforge"
version = "0.1.0"
description = "MoE expert-caching and prefetch research: routing traces, locality analysis, cache simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned to the 2.6 line on purpose: torch 2.6 pairs with Triton 3.2, which is
    # the last Triton release that officially supports Turing (sm_75 / RTX 2060).
    # Stage 0 does not use Triton, but staying on 2.6 keeps Stage 2 reachable
    # without a reinstall. Lift this pin when the GPU moves to sm_80+.
    "torch>=2.6,<2.7",
    "transformers>=4.46,<4.57",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed if you pass --load-4bit. bitsandbytes has official Windows wheels
# from 0.43 onward.
quant = ["bitsandbytes>=0.43"]
notebook = ["jupyter>=1.1", "ipykernel>=6.29"]

[project.scripts]
ff-collect = "flashforge.cli:collect_main"
ff-analyze = "flashforge.cli:analyze_main"
ff-bench = "flashforge.cli:bench_main"
ff-serve = "flashforge.cli:serve_main"
ff-evict = "flashforge.cli:evict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flashforge"]

# torch does not ship CUDA-enabled Windows wheels on the default PyPI index,
# so pull it from PyTorch's cu124 index. cu124 runs fine on sm_75 and on
# driver 560.94.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
